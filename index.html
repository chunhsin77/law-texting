<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國考法規測驗系統 - 模擬測驗</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 20px; background: #f1f5f9; color: #1e293b; }
  .card { background: white; max-width: 720px; margin: 0 auto; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06), 0 8px 10px -6px rgba(0,0,0,0.04); }
  .nav-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
  .nav-title { font-size: 13px; font-weight: bold; color: #64748b; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .jump-bar { display: flex; flex-wrap: wrap; gap: 8px; }
  .jump-btn { width: 34px; height: 34px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
  .jump-btn:hover { background: #f8fafc; }
  .jump-btn.current { border: 2px solid #2563eb !important; color: #2563eb; }
  .jump-btn.answered-correct { background: #dcfce7; border-color: #86efac; color: #166534; }
  .jump-btn.answered-wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
  .badge { display: inline-block; background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
  .question { font-size: 17px; font-weight: 600; margin-bottom: 20px; line-height: 1.6; color: #0f172a; }
  .opt-btn { display: block; width: 100%; text-align: left; padding: 12px 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; font-size: 15px; cursor: pointer; transition: 0.2s; line-height: 1.5; color: #334155; }
  .opt-btn:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
  .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
  .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
  .feedback { margin-top: 18px; padding: 14px 18px; border-radius: 10px; font-size: 14px; display: none; line-height: 1.6; }
  .feedback.correct-box { background: #f0fdf4; border-left: 4px solid #22c55e; color: #166534; }
  .feedback.wrong-box { background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; }
  .control-bar { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
  .btn-prev { background: #e2e8f0; color: #334155; }
  .btn-prev:hover:not(:disabled) { background: #cbd5e1; }
  .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-next { background: #2563eb; color: white; margin-left: auto; }
  .btn-next:hover { background: #1d4ed8; }
  .btn-finish { background: #059669; color: white; }
  .btn-finish:hover { background: #047857; }
  #result-panel { display: none; }
  .score-header { text-align: center; padding: 20px 0; border-bottom: 2px dashed #e2e8f0; margin-bottom: 24px; }
  .score-num { font-size: 52px; font-weight: 800; color: #2563eb; margin: 10px 0; }
  .score-desc { font-size: 15px; color: #64748b; }
  .wrong-section-title { font-size: 18px; font-weight: 700; color: #b91c1c; margin-bottom: 16px; }
  .wrong-card { background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; padding: 18px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
  .wrong-q-title { font-weight: 700; color: #881337; margin-bottom: 10px; font-size: 15px; }
  .wrong-answer-row { margin-bottom: 6px; }
  .wrong-explain { margin-top: 10px; padding-top: 10px; border-top: 1px solid #fecdd3; color: #4c0519; }
  .restart-btn { display: block; width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 20px; transition: 0.2s; }
  .restart-btn:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div class="card">
  <div id="quiz-panel">
    <div class="nav-header">
      <div class="nav-title">
        <span>跳題選單（點選切換題號）</span>
        <span id="progress-text">進度：1 / 10 題</span>
      </div>
      <div class="jump-bar" id="jump-bar"></div>
    </div>
    <div class="badge" id="tag">第 1 題 (每題 10 分)</div>
    <div class="question" id="q-text">題目載入中...</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="control-bar">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="prevQuestion()">上一題</button>
      <button class="nav-btn btn-next" id="btn-next" onclick="nextQuestion()">下一題</button>
      <button class="nav-btn btn-finish" id="btn-finish" style="display:none;" onclick="showResults()">交卷查看成績</button>
    </div>
  </div>
  <div id="result-panel">
    <div class="score-header">
      <div style="font-size: 20px; font-weight: bold;">測驗完成！</div>
      <div class="score-num" id="total-score">0 分</div>
      <div class="score-desc" id="score-summary">共 10 題，每題 10 分</div>
    </div>
    <div id="wrong-container">
      <div class="wrong-section-title">錯題檢討清單</div>
      <div id="wrong-list"></div>
    </div>
    <button class="restart-btn" onclick="startNewQuiz()">重新隨機抽 10 題測驗</button>
  </div>
</div>
<script>
const masterQuizData = [
  { id: 1, question: "依憲法法庭裁判意旨，下列何者因違反憲法權力分立原則而違憲？", options: { A: "立法院以法律規定，得經委員會之決議設調查專案小組，對相關議案或與立法委員職權相關之事項行使調查權及調閱權", B: "立法院以法律規定，調查委員會成立後，其他依法應獨立行使職權之機關及法院亦本於職權進行處理相關案件時，調查委員會得停止調查", C: "對於經立法委員連署所提出之法律修正案，立法院黨團於二讀會逐條討論程序中提出內容完全不同之再修正動議，且未依規定附具立法理由及進行說明或答辯程序", D: "立法院以法律規定，於大法官因任期屆滿、辭職、免職或死亡，以致人數未達憲法增修條文所定人數時，總統應於 2 個月內補足提名大法官" }, answer: "D", explain: "憲法法庭 113 年憲判字第 9 號判決\n立法院以法律課予總統於大法官出缺時「應於 2 個月內補足提名」之法定義務，逾越立法院職權，實質干涉總統專屬提名權，牴觸權力分立原則而違憲。" },
  { id: 2, question: "依司法院解釋意旨，關於憲法基本國策中「保護母性」與「國家應保障婦女之人身安全」之規定，下列何者錯誤？", options: { A: "為落實上述規定之意旨，立法者制訂禁止女性勞工於夜間工作之法律應屬合憲", B: "國家有義務採取各種安全保護措施，保障女性夜行之人身安全", C: "法律課以有意使女性勞工於夜間工作之雇主，必要時提供宿舍之義務，應屬合憲", D: "立法目的若係為追求保護女性勞工之人身安全，屬重要公共利益" }, answer: "A", explain: "司法院釋字第 807 號解釋 宣告勞基法第 49 條第 1 項原則禁止女性夜間工作違憲。限制女性夜間工作加深性別角色刻板印象，違反憲法第 7 條保障性別平等意旨。故 (A) 稱其合憲屬錯誤。" },
  { id: 3, question: "關於憲法人身自由之保障，下列敘述何者錯誤？", options: { A: "不具刑事被告身分之自然人，亦受保障", B: "人民身體完整不受侵犯與傷害之身體權，非屬保障範圍", C: "內政部移民署並非所稱之警察機關，故其要逮捕、拘禁人民，須經法院同意", D: "法律限制人身自由，非屬刑事處罰者，其是否符合法律明確性原則，依釋憲實務見解，適用中度審查標準予以審查" }, answer: "C", explain: "司法院釋字第 708、710 號解釋 移民署等具有實質拘禁、外國人收容公權力之機關，屬憲法第 8 條之廣義警察機關。暫時收容初期無須事先取得法院許可，但逾合理期間須由法院審查裁定。故 (C) 錯誤。" },
  { id: 4, question: "關於憲法遷徙自由之敘述，下列何者正確？", options: { A: "人民以旅行為目的而入出國境，不在遷徙自由之保障範圍內", B: "遷徙自由之限制，屬於絕對法律保留事項，法律不得授權行政機關訂定行政命令予以規範", C: "外國人亦受遷徙自由保障，故國家機關將外國人強制驅逐出國，構成對遷徙自由之干預", D: "依釋憲實務見解，法律對於遷徙自由之限制是否符合比例原則，應採嚴格審查標準予以審查" }, answer: "C", explain: "司法院釋字第 710 號解釋 合法居留之外國人亦享有憲法第 10 條遷徙自由。國家強制驅逐外國人出國，構成對遷徙自由之重大限制與干預。(A) 入出境受保障；(B) 非絕對法律保留；(D) 採中度審查基準。" },
  { id: 5, question: "依司法院釋字第 756 號解釋意旨，關於受刑人之秘密通訊自由，下列敘述何者正確？", options: { A: "受刑人就通訊有無及內容等事項，有不受國家及他人任意侵擾之權利", B: "為維護人性尊嚴，秘密通訊自由乃憲法保障表現自由之具體態樣之一", C: "監獄長官檢查受刑人書信有無夾帶違禁品，即侵害通訊內容之秘密性", D: "監獄長官不得閱讀受刑人書信之內容，始足以確保通訊內容之秘密性" }, answer: "A", explain: "司法院釋字第 756 號解釋 受刑人之秘密通訊自由仍受憲法保障，享有不受任意侵擾之權利。長官為戒護安全得「檢查」有無夾帶違禁品，但非有正當理由不得任意「閱讀」書信內容。" },
  { id: 6, question: "依司法院解釋意旨及憲法法庭裁判，關於言論自由之審查基準，下列何者與其他三個選項不同？", options: { A: "禁止醫師為醫療廣告之規定", B: "對街頭藝人演出內容之審查規定", C: "容許法院得以判決命加害人強制道歉，以回復他人名譽之立法", D: "人民團體法對主張共產主義、分裂國體之團體不許可設立之規定" }, answer: "A", explain: "釋字第 577、623、644 號、111 年憲判字第 2 號 (A) 醫療廣告屬於「商業言論」，採中度審查基準；(B) 街頭藝人表演審查、(C) 強制道歉（涉不表意自由）、(D) 人民團體政治主張限制，均採嚴格審查標準。" },
  { id: 7, question: "依司法院解釋意旨，關於依政府採購法得標之廠商員工逾百者，未依法僱用一定比例之原住民而須繳納代金之規定，下列敘述何者錯誤？", options: { A: "要求得標廠商於履約期間進用一定比例原住民，係限制廠商之營業自由", B: "廠商未達進用原住民之標準者須繳納代金，屬對財產權之限制", C: "依國內員工人數是否逾百，決定廠商是否負有進用原住民義務，形成差別待遇，與平等原則有違", D: "廠商應繳納之代金金額超過採購金額，個案顯然過苛之情狀，立法者若未設適當調整機制，則有違比例原則" }, answer: "C", explain: "司法院釋字第 810 號解釋 政府採購得標廠商員工逾百人須僱用一定比例原住民否則繳納代金，係衡量企業規模及僱用能力所為之合理分類，目的正當，與憲法第 7 條平等原則尚屬無違。故 (C) 錯誤。" },
  { id: 8, question: "依司法院解釋意旨及憲法法庭裁判，關於財產權之限制，下列何者並未形成財產上特別犧牲？", options: { A: "援引農田水利法關於原提供為水利使用之土地，應照舊使用之規定，作為未以租用、價購或其他方式取得人民所有土地之使用權源", B: "需用土地人因興辦土地徵收條例規定所定之事業，而穿越私有土地之上空或地下", C: "土地所有人因定著於其土地上之建造物及附屬設施，被依文化資產保護法相關規定登錄為歷史建築", D: "騎樓通道所在土地之所有權人因道路交通管理處罰條例相關規定，遭禁止於該騎樓通道擺設攤位" }, answer: "D", explain: "司法院釋字第 564 號解釋 禁止於騎樓擺設攤位，係為維護公眾通行安全，屬於財產權之「社會責任（社會義務）」內在限制，未達特別犧牲程度，不生補償問題。(A)、(B)、(C) 均構成特別犧牲。" },
  { id: 9, question: "依司法院解釋意旨，下列何者違憲侵害憲法保障之工作權？", options: { A: "不動產估價師法禁止不動產估價師設立分事務所", B: "藥事法限制醫師藥品調劑權", C: "藥師法規定藥師執業處所應以一處為限", D: "中醫師特考有零分或專業科目平均成績或特定科目成績未達規定者不予及格" }, answer: "C", explain: "司法院釋字第 711 號解釋 藥師法第 11 條規定「藥師執業處所應以一處為限」，未顧及偏遠醫療地區支援或緊急需要，限制過苛，違反比例原則並侵害憲法第 15 條保障之工作權。" },
  { id: 10, question: "依司法院解釋意旨及憲法法庭裁判，關於訴訟權保障之敘述，下列何者錯誤？", options: { A: "向法院提起訴訟，請求依正當法律程序公平審判，以獲及時有效救濟之機會，為訴訟權保障之核心內容", B: "審級制度屬訴訟權保障之核心內容，故任何訴訟事件均得上訴於第三審", C: "法官先後參與同一案件上下級審判之迴避，屬訴訟權保障之核心內容", D: "法定法官原則為法治國家所依循之憲法原則，法院案件之分配不容恣意操控" }, answer: "B", explain: "司法院釋字第 396、442、512 號解釋 審級制度屬「立法裁量範疇」，憲法並未保障所有案件均得享有三級三審之權利，立法者得衡酌訴訟性質與資源分配酌設審級限制。故 (B) 錯誤。" },
  { id: 11, question: "依司法院解釋意旨，下列何者不屬於憲法服公職權保障之範圍？", options: { A: "公務人員依法令晉敘陞遷之權利", B: "公務人員之在職進修", C: "公務人員依法取得之官等", D: "公務人員之俸給" }, answer: "B", explain: "司法院釋字第 611 號解釋 憲法第 18 條服公職權保障公務員之身分、官等、俸給及依法晉敘陞遷之權利。公務人員之「在職進修」屬機關行政管理措施，非屬服公職權直接保障之核心範疇。" },
  { id: 12, question: "依司法院釋字第 490 號解釋意旨，關於我國兵役制度，下列敘述何者錯誤？", options: { A: "有關人民服兵役之重要事項，應由立法者斟酌國家安全、社會發展之需要，以法律定之，屬立法政策之考量", B: "立法者未考量宗教自由，使人民有免服兵役之權利，係屬違憲", C: "服兵役之義務，並無違反人性尊嚴，亦未動搖憲法價值體系之基礎", D: "服兵役之義務，係為保護人民，防衛國家之安全所必需，與憲法第 7 條平等原則並無牴觸" }, answer: "B", explain: "司法院釋字第 490 號解釋 人民服兵役之義務為防衛國家安全所必需，具有強制性。宗教信仰自由不能凌駕於防衛義務之上；立法者未准免服兵役屬立法政策自由形成範圍，並未違憲。故 (B) 錯誤。" },
  { id: 13, question: "依司法院解釋意旨及憲法法庭裁判，關於隱私權之敘述，下列何者正確？", options: { A: "人體尿液雖不如血液般蘊含大量個人生物特徵識別資料，其對受採尿者憲法上資訊隱私權之侵害程度，仍與強制採檢血液之情形相當", B: "個人一旦身處在公共場所中，一舉一動本來就是可為人所共見共聞，自無從主張不受他人持續注視、監看、監聽、接近等侵擾之私人活動領域及個人資料自主之自由", C: "指紋作為一種敏感性個人資訊，國家如以強制之方法大規模蒐集國民之指紋資料，必須是為了達成重大公益之目的，且以密切關聯之侵害較小手段為之，方能合憲", D: "經處理過的個人健保資料，僅屬於「間接識別該個人」之資料，當事人對於此類資料之自主控制權，並不受憲法保障" }, answer: "C", explain: "司法院釋字第 603 號解釋、111 年憲判字第 13 號 強制大規模蒐集個人指紋，必須為達重大公益且符合比例原則之最小侵害手段方能合憲。(B) 公共場所亦享合理隱私期待；(D) 間接識別資料仍受資訊隱私權保護。" },
  { id: 14, question: "依司法院解釋意旨，下列何者應由立法者以法律定之，不得授權行政機關以命令予以規範？", options: { A: "容器回收清除處理費之課徵對象及費率", B: "全民健康保險醫事服務機構違反全民健康保險特約之處理", C: "涉及公共利益或實現人民基本權利之保障等重大事項之給付行政措施", D: "公法上請求權之消滅時效" }, answer: "D", explain: "司法院釋字第 474 號解釋 時效制度涉及公法上權利義務之得喪變更及法律關係之安定，屬重大權利限制，應恪遵「法律保留原則」，不得授權行政機關以行政命令規範。" },
  { id: 15, question: "依憲法法庭裁判意旨，關於公務員之人事權，下列敘述何者錯誤？", options: { A: "有關公務員之任命及免職，法律得就其資格、程序、效果等為一般性規定", B: "公務員之任命為人事權之起點，免職為終點，兩者俱為人事權之核心事項", C: "公務員之免職決定權，僅得由憲法上單一機關行使，不得與其他憲政機關分享之", D: "依制憲意旨或修憲規定，均無從認定憲法第 77 條規定蘊含懲戒一元化原則" }, answer: "C", explain: "憲法法庭 111 年憲判字第 9 號判決 公務員免職權限非由單一憲法機關獨佔。行政機關得依考績法予以考績免職（行政懲處），懲戒法院亦得判決免除職務（司法懲戒），二者並存，故 (C) 稱「僅單一機關行使」錯誤。" },
  { id: 16, question: "依司法院解釋意旨及憲法法庭裁判，關於立法院之敘述，下列何者錯誤？", options: { A: "行政院有向立法院提出施政方針及施政報告之責，立法委員在開會時，有向行政院院長及行政院各部會首長質詢之權", B: "除法律明定外，立法院邀請地方自治團體行政機關相關人員到會備詢，其得自行衡酌到會說明之必要性，決定是否到會", C: "立法院委員會之會議舉行方式屬於國會自律事項，故縱使會議舉行不符委員會開會要件，受邀與會的政府人員仍有到會備詢或答詢的義務", D: "政府人員應邀出席立法院各種委員會，係政治責任之一環，其備詢或說明義務非屬法律義務與責任，不得對政府人員施以法律制裁" }, answer: "C", explain: "司法院釋字第 461 號、113 年憲判字第 9 號 立法院行使職權仍須遵守憲法正當法律程序及法定開會要件。若委員會之舉行欠缺法定程序要件，即非合法成立之會議，受邀政府人員無到會備詢之義務。故 (C) 錯誤。" },
  { id: 17, question: "關於監察院彈劾對象或移送程序，下列敘述何者正確？", options: { A: "監察院得彈劾中央公務人員，但不得彈劾地方公務人員", B: "監察院之彈劾對象不僅包括中央公務人員及司法院、考試院人員，也包括監察院人員", C: "薦任第九職等以下公務員，也應經送請監察院審查，主管機關首長不得逕送懲戒法院審理", D: "監察院成立彈劾案後，應續依職權作成懲戒處分" }, answer: "B", explain: "憲法第 97 條第 2 項、公務員懲戒法第 24 條 監察委員及監察院人員違法失職亦受彈劾監督；薦任第九職等以下公務員主管長官得逕送懲戒法院；監察院彈劾成立後係移送懲戒法院審理，本身無懲戒處分權。故選 (B)。" },
  { id: 18, question: "依司法院解釋意旨，下列憲法訴訟之聲請，何者應不予受理？", options: { A: "臺北市政府執行中央委辦事項，認應適用之中央法律有違背憲法之疑義，臺北市聲請解釋", B: "高雄市政府辦理自治事項，認所應適用之中央法規有侵害其受憲法保障之自治權時，高雄市聲請解釋", C: "行政院認臺中市議會之決議事項牴觸憲法並函告無效後，臺中市窮盡救濟途徑後聲請解釋", D: "內政部認嘉義市政府訂定發布之自治規則有牴觸憲法而函告無效後，嘉義市窮盡救濟途徑後聲請解釋" }, answer: "A", explain: "司法院釋字第 527 號解釋 地方自治團體僅於辦理「自治事項」認法律牴觸憲法時得聲請解釋；若係執行中央「委辦事項」，地方係基於下級機關地位受中央監督，不得以此聲請憲法解釋。故 (A) 應不予受理。" },
  { id: 19, question: "關於我國憲法訴訟法上各類憲法訴訟聲請要件，下列敘述何者錯誤？", options: { A: "人民於其憲法上所保障之權利遭受不法侵害，經依法定程序用盡審級救濟程序，對於所受不利確定終局裁判，或該裁判及其所適用之法律位階法規範，認有牴觸憲法者，得聲請憲法法庭為宣告違憲之判決", B: "各法院就其審理之案件，對裁判上所應適用之法律位階法規範，依其合理確信，認有牴觸憲法，且於該案件之裁判結果有直接影響者，得聲請憲法法庭為宣告違憲之判決", C: "國家最高機關，因本身或下級機關行使職權，就所適用之法規範，認有牴觸憲法者，得聲請憲法法庭為宣告違憲之判決", D: "立法委員現有總額四分之一以上，就其行使職權，認法律位階法規範牴觸憲法者，得聲請憲法法庭為宣告違憲之判決" }, answer: "A", explain: "憲法訴訟法第 59 條第 1 項 人民聲請憲法審查之標的，包含「不利確定終局裁判」及「裁判所適用之法規範」（包含法規命令，非僅限法律位階）。(A) 選項漏列法規命令，敘述有誤。" },
  { id: 20, question: "地方制度法規定縣議會正副議長之選舉方式應為記名投票，但某縣議會組織自治條例卻規定為無記名投票。依司法院釋字第 769 號解釋意旨，下列敘述何者正確？", options: { A: "縣議會正副議長選舉應以無記名投票之方式行之，故地方制度法之規定違憲", B: "中央得於合理範圍內規範縣議會組織之重要事項，故地方制度法之規定合憲", C: "正副議長之選舉方式為議會自律之核心保障領域，故自治條例之規定合憲", D: "正副議長之選舉方式具有全國一致必要之性質，故自治條例之規定違憲" }, answer: "B", explain: "司法院釋字第 769 號解釋 地方議會正副議長選舉非憲法直接規範之無記名投票保障範疇。中央基於反賄選之重大公共利益於地方制度法中規範採記名投票，合乎合理規範範疇，合憲有效。" },
  { id: 21, question: "關於「行政」概念，下列敘述何者錯誤？", options: { A: "立法院院長為維持秩序而行使警察權，屬實質意義之行政範疇", B: "法庭之設置、席位布置及旁聽等事務，屬實質意義之行政範疇", C: "監察院依公職人員財產申報法受理公職人員財產申報及科處罰鍰事項，非屬實質意義之行政範疇", D: "監察院行使彈劾、糾舉及審計權，非屬實質意義之行政範疇" }, answer: "C", explain: "實質行政與形式行政學理、公職人員財產申報法 實質意義之行政指本於公益為積極、具體之法律實施。監察院依財產申報法受理申報及裁罰，屬具體執行法律之行政處分，實質上屬行政範疇。故 (C) 稱「非屬行政」錯誤。" },
  { id: 22, question: "直轄市政府提供因風災農作物受損達一定程度之農民優惠貸款，農民甲與貸款機構間，屬下列何種行為？", options: { A: "公私協力行為", B: "行政輔助行為", C: "行政營利行為", D: "行政私法行為" }, answer: "D", explain: "行政私法學理（私法形式之給付行政） 直轄市政府提供受災農民優惠貸款，係行政機關以私法契約（借貸）形式達成給付行政與社會照顧目的，在行政法學理上稱為「行政私法行為」。" },
  { id: 23, question: "依司法院解釋意旨及憲法法庭裁判，關於授權明確性原則，下列敘述何者正確？", options: { A: "教師法第 35 條第 2 項規定：「代理教師之權利、義務，由教育部訂定辦法規定之。」系爭規定欠缺可運作之具體指引，違反授權明確性原則", B: "懲治走私條例第 2 條第 1 項規定：「私運管制物品進口、出口逾公告數額者，處七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。」第 3 項規定：「第一項所稱管制物品及其數額，由行政院公告之。」系爭規定已足使人民預見行為有受處罰之可能，與授權明確性原則無違", C: "廢棄物清理法第 27 條規定：「在指定清除地區內嚴禁有下列行為：……十一、其他經主管機關公告之污染環境行為。」受規範者難以直接推知公告禁止之行為，系爭規定違反授權明確性原則", D: "全民健康保險法第 55 條第 2 項規定：「前項保險醫事服務機構之特約及管理辦法，由主管機關定之。」綜合關聯法條，立法者業已提供主管機關可資遵循之具體方針，系爭規定與授權明確性原則無違" }, answer: "D", explain: "司法院釋字第 522、533 號、113 年憲判字第 5 號 (D) 健保特約及管理授權符合明確性原則；(A) 教師法代理教師聘任授權合憲（113 年憲判字第 5 號）；(B) 刑罰構成要件概括授權公告違反明確性（釋字第 522 號）。" },
  { id: 24, question: "甲欲新建大樓，向 A 建築主管機關申請並獲得建造執照。數月後，A 機關發現建造執照核發有違誤，乃決定將該執照撤銷。甲表示其已購入建材，準備進行工程，撤銷建造執照將造成其重大損失。下列敘述何者錯誤？", options: { A: "甲對於建造執照之違法，取得執照時並不知情，其信賴仍未必值得保護", B: "假設甲的信賴值得保護，而建造執照之程序違法只要甲提供其手上已有之文件即可補正，A 機關即不得逕予撤銷", C: "若甲之信賴值得保護，而建造執照之違法所涉法規乃在保障公共安全之重大利益，A 機關仍得依法撤銷", D: "A 機關撤銷建照執照後，對甲所遭受之財產上損失給予補償，甲若對補償金額不服，得提起撤銷訴訟" }, answer: "D", explain: "行政程序法第 120 條、行政訴訟法第 8 條 人民對違法處分撤銷後之「信賴補償金額」不服，因該爭議係請求金錢給付之數額爭執，依法應向行政法院提起「一般給付訴訟」，而非提起「撤銷訴訟」。故 (D) 錯誤。" },
  { id: 25, question: "國家通訊傳播委員會對所屬公務員甲作成年終考績處分丙等之決定，甲不服提起行政訴訟。行政法院審查考績處分違法性時，應予適度尊重機關判斷餘地，最不可能的是下列何理由？", options: { A: "國家通訊傳播委員會為獨立機關", B: "人事權為行政權所不可或缺之核心權力", C: "考績處分具有高度屬人性，非他人所能擅代", D: "組織或程序上，行政部門更適合作成考績處分" }, answer: "A", explain: "司法院釋字第 462 號、判斷餘地學理 考績考核享有判斷餘地，係因考核涉及高度屬人性、長官親歷觀察與行政領導核心權力，與「機關是否為獨立機關」無關，任何行政機關均享有考績判斷餘地。故選 (A)。" },
  { id: 26, question: "消防隊接獲民眾因發生火災之報案電話時，應立即出動消防車進行救火事宜，並無決定出動消防車救火與否之裁量權，此屬下列何種概念？", options: { A: "法律保留原則", B: "授權明確性原則", C: "信賴保護原則", D: "裁量限縮至零" }, answer: "D", explain: "行政裁量學理、司法院釋字第 469 號解釋 當人民生命、身體或重大財產面臨急迫危險時，行政機關之裁量範圍限縮至僅有「立即出動搶救」一種唯一合法決定，學理上稱為「裁量限縮至零」（裁量收縮至零）。" },
  { id: 27, question: "下列何者為公法人？", options: { A: "國家教育研究院", B: "醫師公會", C: "農會", D: "直轄市山地原住民區" }, answer: "D", explain: "" },
  { id: 28, question: "下列何者屬於行政機關委託私人行使公權力之行為？", options: { A: "國家發展委員會委託私立大學進行公共服務滿意度調查結果之分析", B: "考選部委託具一定資格之民間團體辦理性質特殊之考試", C: "食品衛生主管機關將查扣之違規食品委託具一定資格之民間機構進行技術性檢驗", D: "道路主管機關委託私人企業興建公有停車場" }, answer: "B", explain: "" },
  { id: 29, question: "甲公司向 A 市政府所屬建築主管機關申請建築執照，A 市政府初步審查後發現該建案涉及跨越 A 市與 B 市的行政區域。A 市政府遂將案件移送 B 市政府所屬建築主管機關處理。B 市政府建築主管機關認為應由 A 市政府建築主管機關負責，也拒絕受理。雙方協議未果，且無共同上級機關。下列敘述何者正確？", options: { A: "甲公司得向行政法院申請指定管轄", B: "甲公司僅得向 A 市政府的上級機關申請指定管轄", C: "甲公司得向 A 市政府或 B 市政府申請指定管轄", D: "甲公司應等待 A 市政府與 B 市政府自行協議解決" }, answer: "C", explain: "" },
  { id: 30, question: "關於地方自治團體民選首長應適用之法律，下列敘述何者正確？", options: { A: "鄉長受縣政府記過之懲處，得依公務人員保障法提起復審救濟", B: "內政部應依公務人員考績法對各縣（市）長與直轄市長辦理年終考績", C: "地方民選首長違反公務員服務法中禁止兼職規定，依公務員懲戒法進行懲戒", D: "地方民選首長卸任時，應依公務人員退休資遣撫卹法請領退休金" }, answer: "C", explain: "公務人員保障法不適用：依《公務人員保障法》第 3 條規定，該法所稱公務人員係指「法定機關（構）依法任用之有給專任人員及公立學校依法任用之職員」，民選公職人員（如鄉長）不適用公務人員保障法，亦非準用對象。此外，縣政府對自治團體民選首長僅能行使「自治監督權」（如停職、解職或移送懲戒），並無行政監督下的「行政懲處權」（即不得對民選首長記過、申誡）。依《公務人員考績法》第 1 條及第 3 條規定，考績法適用的對象為依公務人員任用法律任用、派用之現職人員。民選首長（直轄市長、縣市長）為政治性任命/民選公職，其去留及政治責任由選民透過選舉與罷免決定，不辦理公務人員年終考績。公務員服務法適用範圍：依《公務員服務法》第 2 條規定，受有俸給之文武職公務員及公營事業機構純勞工以外之人員，均適用該法；地方民選行政首長亦屬受有俸給之公務員，須遵守第 14 條等禁止兼職之規定。民選首長非依公務人員任用法律銓敘審定之公務人員，不適用《公務人員退休資遣撫卹法》。" },
  { id: 31, question: "依地方制度法規定，關於直轄市議會定期會開會，下列敘述何者正確？", options: { A: "市長應列席說明施政綱要，但不受質詢", B: "市政府秘書長應提出施政報告，並備質詢", C: "市政府一級單位主管應提出業務報告，並備質詢", D: "市政府二級機關首長應提出業務報告，並備質詢" }, answer: "C", explain: "" },
  { id: 32, question: "依公務員懲戒法規定，關於公務員懲戒行使期間，下列敘述何者錯誤？", options: { A: "免除職務並無懲戒行使期間限制", B: "剝奪退休金並無懲戒行使期間限制", C: "休職並無懲戒行使期間限制", D: "應受懲戒行為，自行為終了之日起，至案件繫屬懲戒法院之日止，已逾 5 年者，不得予以減少退休金之懲戒" }, answer: "C", explain: "免除職務、撤職、剝奪退休（職、伍）金。此三種為情節最重大之處分，基於公務紀律與社會正義，法律並未設行使期間之限制。依《公務員懲戒法》第 20 條第 1 項規定：「應受懲戒行為，自行為終了之日起，至案件繫屬懲戒法院之日止，已逾十年者，不得予以休職處分。」依第 20 條第 2 項規定：「應受懲戒行為，自行為終了之日起，至案件繫屬懲戒法院之日止，已逾五年者，不得予以減少退休（職、伍）金、降級、減俸、罰款、記過或申誡之處分。」" },
  { id: 33, question: "下列何者非屬行政規則？", options: { A: "地方主管機關遇有適用法律之疑義，函請中央主管機關解釋，中央主管機關就該抽象法律問題所為之釋示", B: "納稅義務人去函財政部針對其個人如何節稅之程序提出詢問，財政部就此事項所為之回覆", C: "行政機關依職權訂定之違法行為裁罰基準表", D: "行政機關自行訂定之公文時程作業規定" }, answer: "B", explain: "" },
  { id: 34, question: "學校依學位授予法發給學生學位證書，為下列何種行政處分？", options: { A: "下命處分", B: "確認處分", C: "形成處分", D: "一般處分" }, answer: "B", explain: "確認處分定義：指行政機關就特定法律關係、權利身分或法律上具有重要意義之事項或資格之「存在與否」予以官方權威認定。處分本身並不創設或變更既有的權利關係，僅在於對既有之事實與資格為法律上的確認。形成處分定義：指直接設定、變更或消滅特定法律關係或權利能力之處分（例如：公務人員之任命、核發建築執照、撤銷專利權、許可設立社團）。" },
  { id: 35, question: "關於行政處分之敘述，下列何者正確？", options: { A: "未依法定程序作成之行政處分，係無效行政處分", B: "授予利益之合法行政處分，得由原處分機關之上級機關依職權為全部或一部之廢止", C: "警察以手勢指揮車輛之駕駛人，係一般處分", D: "行政機關轉換行政處分時，轉換前均應給予當事人陳述意見之機會" }, answer: "C", explain: "" },
  { id: 36, question: "依行政程序法及最新司法實務見解，關於行政處分之撤銷，下列敘述何者錯誤？", options: { A: "違法行政處分撤銷權之除斥期間為原處分機關或其上級機關知有撤銷原因時起 2 年內", B: "所謂知有行政處分撤銷原因，係指原處分機關或其上級機關客觀上有足認該行政處分違法之事證時", C: "行政機關撤銷違法行政處分後，該行政處分原則上溯及既往失其效力", D: "行政機關撤銷違法授益行政處分，且該行政處分溯及既往失效，若當事人先前曾因該處分而領受金錢或可分物之給付時，行政機關得向當事人請求返還" }, answer: "B", explain: "依最高行政法院 102 年 2 月份第 2 次庭長法官聯席會議決議意旨：《行政程序法》第 121 條第 1 項所稱「知有撤銷原因」，係指「明知及確實知曉該處分有撤銷之原因，即實質上知悉其為違法」而言。" },
  { id: 37, question: "若主管機關修正民宿業管理辦法，將環保標準提高，並規定原已登記之業者若未能符合新標準，應於6 個月內改善，否則將廢止許可，民宿業者甲因財務困難無法在期限內完成改善，主管機關遂依新規定廢止甲之民宿經營許可。下列敘述何者正確？", options: { A: "該民宿經營許可經廢止後，原則上應溯及既往失其效力", B: "甲因財務能力不佳未能改善符合新標準，其信賴不值得保護", C: "經營許可之廢止，應自廢止原因發生後 2 年內為之", D: "主管機關依新規定廢止經營許可時，對甲因遭受非財產上之損失，應給予合理之補償" }, answer: "C", explain: "" },
  { id: 38, question: "依行政程序法規定，關於公法上請求權之時效，下列敘述何者正確？", options: { A: "公法上請求權時效，除其他法律另有規定外，一律皆為 5 年", B: "公法上請求權，若因時效完成，則生抗辯事由", C: "公法上請求權，並無時效中斷之適用", D: "行政處分因撤銷、廢止或其他事由而溯及既往失效時，自該處分失效時起，已中斷之時效視為不中斷" }, answer: "D", explain: "" },
  { id: 39, question: "關於作成行政處分之正當法律程序，下列敘述何者正確？", options: { A: "行政機關作成侵害人民權益之行政處分前，原則上應給予當事人陳述意見之機會，以符合正當法律程序之要求", B: "行政處分作成後，若當事人對其不服，其救濟途徑係直接提起行政訴訟", C: "行政機關作成行政處分前，若已經過內部審查程序，可不必再給予當事人陳述意見之機會", D: "行政處分之正當法律程序僅適用於涉及人身自由之案件，不適用於財產權之限制" }, answer: "A", explain: "" },
  { id: 40, question: "依憲法法庭 111 年憲判字第 11 號判決意旨，國立大學經學校教師評審委員會審議後，依據聘約中所另定之不續聘規定，於聘約期限屆至時不續聘教師，則該不續聘行為之法律性質為何？", options: { A: "基於行政契約所為之意思表示", B: "基於教師法及教育人員任用條例所為之行政處分", C: "基於私法僱傭契約所為之意思表示", D: "基於教師法及公務人員考績法所為之行政懲處處分" }, answer: "A", explain: "" },
  { id: 41, question: "關於行政契約之敘述，下列何者正確？", options: { A: "行政契約與民事契約相同，雙方當事人基於契約自由原則可自行決定內容", B: "行政契約之一部無效者，全部無效。但如可認為欠缺該部分，締約雙方亦將締結契約者，其他部分仍為有效", C: "行政契約之成立僅需締約機關內部決定，即立即生效", D: "行政契約與民事契約相同，原則上得以言詞締結契約" }, answer: "B", explain: "" },
  { id: 42, question: "甲所有之建築物出租予乙，乙變更使用，於該建築物內違規經營資訊休閒服務業，與使用執照核定之使用不符，建築主管機關查獲後，欲依建築法規定：「有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經營者新臺幣……罰鍰，……：一、違反第 73 條第 2 項規定，未經核准變更使用擅自使用建築物者。」條文中之建築物所有權人為甲，使用人為乙，依司法實務見解，建築主管機關應以誰為處罰對象，方為適法？", options: { A: "甲", B: "乙", C: "同時處罰甲與乙", D: "處罰甲或乙或同時處罰均在其合法裁量範圍內" }, answer: "B", explain: "" },
  { id: 43, question: "關於公物之敘述，下列何者錯誤？", options: { A: "公物在一定條件下仍得作為強制執行之標的", B: "行政機關所為公物設定或廢止之行為，為一般處分", C: "公物之所有權人可能是私人", D: "人民對於任何公物均不得主張使用之權利" }, answer: "D", explain: "" },
  { id: 44, question: "教育部訪視私立大學甲後，發函稱：「貴校現有校務基金宜先用於改善學生宿舍與教學設施，如增設餐飲科系，將使現有科系資源受到負面影響。本部後續依法之定期訪視，將協助貴校針對學生宿舍與教學設施加以改善。」下列敘述何者正確？", options: { A: "此函之內容不法侵害甲之聲譽，甲得依法提起訴願", B: "此函係屬行政指導，對甲不具法律拘束力", C: "此函係屬業務監督之指令", D: "此函內容提及後續依法定期訪視，係屬行政處分" }, answer: "B", explain: "" },
  { id: 45, question: "關於行政程序法之聽證規定，下列何者正確？", options: { A: "機關作成行政處分前皆須舉行聽證，因行政處分影響人民權益甚鉅", B: "聽證主持人應由行政機關首長擔任，或由其指定具有法律專業者擔任", C: "行政機關經聽證而作成行政處分者，得斟酌全部聽證之結果，但不受聽證結論之拘束", D: "行政機關經聽證作成之行政處分，人民不服時，其救濟免除訴願及其先行程序" }, answer: "D", explain: "" },
  { id: 46, question: "甲申請投資補助，主管機關雖核准，但補助金額少於甲申請之數額甚多，甲希望閱覽相關審議資料，以了解主管機關決定之理由，作為行政爭訟之準備。依目前實務見解，下列敘述何者正確？", options: { A: "甲應依政府資訊公開法向原處分機關申請相關資料", B: "若相關資料已經歸檔，甲應適用檔案法向原處分機關提出申請", C: "甲應依行政程序法向原處分機關申請閱覽相關資料", D: "甲應依政府資訊公開法或行政程序法，向行政法院提起一般給付之訴" }, answer: "C", explain: "" },
  { id: 47, question: "依司法實務見解，執行機關依行政執行法規定，命義務人繳納代履行執行費用之預估金額，下列敘述何者正確？", options: { A: "該命令乃行政事實行為", B: "該命令同時具有執行命令及行政處分之性質", C: "義務人不服該命令，依行政執行法規定聲明異議而無理由者，義務人得再提起訴願", D: "代履行費用逾期未繳納者，由原處分機關依行政執行法規定執行之" }, answer: "B", explain: "最高行政法院決議指出：執行機關命義務人繳納代履行費用之預估金額命令（預估費用命令），係執行機關為執行行為而對義務人核定預估費用數額並課以公法上給付義務。依《行政執行法》第 34 條規定：「代履行費用或怠金，逾期未繳納者，移送法務部行政執行署所屬行政執行分署依本法第二章之規定執行之。」" },
  { id: 48, question: "依司法實務見解，下列何者在訴願程序上為適格當事人？", options: { A: "甲男因違反校規受退學處分，其父主張自身名譽權被侵害，以自己名義提起撤銷訴願", B: "乙女因違反廢棄物清理法而受罰鍰處分，其夫主張，家中罰單均由其繳納，本案其財產權受侵害，遂以自己名義提起撤銷訴願", C: "丙為某證券公司之總經理，其涉嫌從事不法交易，主管機關去函該公司，要求解除丙總經理職務，丙得知後表示不服，對此提起撤銷訴願", D: "丁女係大陸地區人民，為臺灣人民戊的配偶，丁依法向主管機關提出「來臺團聚」之申請，主管機關否准，戊以自己名義提起訴願及課予義務訴訟" }, answer: "C", explain: "" },
  { id: 49, question: "甲有土地一筆經徵收作為學校預定地，惟因少子化該學校遲未設立，甲遂依法請求買回被徵收土地。該管直轄市地政機關經查明合於依照徵收價額收回其土地之要件，並層報原核准徵收機關。但原核准徵收機關作成否准之決定，而函覆該管直轄市地政機關通知甲時，依司法實務見解，何者為原處分機關？", options: { A: "應以直轄市政府為處分機關，因其為需地機關", B: "應以原核准徵收機關為處分機關，因其為本於法定職權作成行政處分，交由下級機關執行之情形", C: "應以直轄市地政機關為處分機關，因其為徵收機關", D: "應以直轄市地政機關為處分機關，因係由其函覆甲請求買回之結果" }, answer: "B", explain: "" },
  { id: 50, question: "下列何者非屬得依行政訴訟法提起確認訴訟之情形？", options: { A: "以拆除違章建築之處分無效為由而提起確認訴訟", B: "以土地徵收失效為由而提起確認訴訟", C: "以沒入處分違法且標的物已銷毀為由而提起確認訴訟", D: "以行政機關僱用工友之契約有效為由而提起確認訴訟" }, answer: "D", explain: "" },
  { id: 51, question: "受公路主管機關委託辦理汽車定期檢驗之民間汽車修護廠認某車輛檢查結果為不合格，該車主經訴願被駁回後，擬提起行政訴訟，應以何者為被告？", options: { A: "受委託辦理汽車檢驗之民間汽車修護廠", B: "監理站", C: "委託檢驗車輛之委託機關", D: "以受委託辦理汽車檢驗之民間汽車修護廠與委託機關為共同被告" }, answer: "A", explain: "" },
  { id: 52, question: "A 公司因違反環保法規，被主管機關命令停工，A 公司不服，經訴願遭駁回，提起行政訴訟請求撤銷該處分。行政法院審理後，發現主管機關之處分雖屬違法，但若直接撤銷該處分，將造成重大環境污染風險，影響公益。關於行政法院之判決方式，下列何者正確？", options: { A: "行政法院得直接改處罰鍰，使其符合比例原則，無須發回原處分機關", B: "若行政法院認為撤銷該處分對公益有重大損害時，得駁回原告之訴，但須於判決主文中諭知該處分違法", C: "行政法院應發回原處分機關，命其重新作成處分，而不得直接駁回訴訟", D: "若行政法院認為原處分違法時，必須撤銷該處分，不得因公益考量而拒絕撤銷" }, answer: "B", explain: "" },
  { id: 53, question: "甲與乙因網路交易產生糾紛，經乙向警察機關報案後，由警察機關通報銀行將甲之帳戶設定為警示帳戶。依行政法院實務見解，甲如認為其權利受侵害應如何救濟？", options: { A: "針對通報行為提起撤銷訴願", B: "針對通報行為提起課予義務訴願", C: "提起一般給付之訴請求機關撤回通報", D: "向銀行提起民事訴訟請求解除警示帳戶" }, answer: "A", explain: "依最高行政法院 103 年 10 月份第 1 次庭長法官聯席會議決議意旨：警察機關依《存款帳戶及其疑似不法或顯屬異常交易管理辦法》規定，通報金融機構將特定帳戶列為「警示帳戶」，並非單純機關間之內部觀念通知或行政事實行為。該通報行為具備法效性、外部性與對象特定性，其法律性質為「下命行政處分」（具有第三人效力之處分）。" },
  { id: 54, question: "依國家賠償法規定，下列敘述何者錯誤？", options: { A: "公務員違法責任不限於公務員之積極行為", B: "公務員違法責任採過失賠償主義", C: "自然公物內設施之瑕疵責任，採過失賠償主義", D: "賠償責任之主體以國家法人為限" }, answer: "D", explain: "依 108 年修正後之《國家賠償法》第 3 條第 3 項規定：「前項於開放之山域、水域等自然公物，經管理機關、受委託管理之民間團體或個人已就使用該自然公物為適當之警告或標示，而人民仍從事冒險或具危險性活動者，國家不負損害賠償責任。」第 4 項進一步明定：「第一項及前項情形，於開放之山域、水域等自然公物內之設施，經管理機關、受委託管理之民間團體或個人已就使用該設施為適當之警告或標示，而人民仍從事冒險或具危險性活動者，得減輕或免除國家賠償責任。」" },
  { id: 55, question: "下列何者非屬特別犧牲之行政損失補償事由？", options: { A: "下水道機構因工程上必要，依法在私人土地下方埋設管道", B: "主管機關於防疫期間依法徵用特定醫院之防疫設備及藥品", C: "私有建築物經主管機關依法指定為暫定古蹟而限制使用", D: "犯罪行為之被害人依法申請犯罪被害補償金" }, answer: "D", explain: "" },
  { id: 56, question: "關於條約之保留，下列敘述何者錯誤？", options: { A: "締約國一旦做出條約保留，即不得撤回", B: "即使條約未規定不得保留，保留亦不得違背條約之目的與宗旨", C: "條約保留之目的，在排除或變更部分條約對該國適用時之法律效果", D: "依條約為保留之締約國，就保留部分與反對保留之締約國不存在條約關係" }, answer: "A", explain: "" },
  { id: 57, question: "依據維也納條約法公約規定，下列何者得為有效之國際條約？", options: { A: "多國間締結創設政府間國際組織之協議", B: "甲、乙兩國的地方政府未經國家授權簽訂之姊妹都市協定", C: "甲、乙兩國所簽訂由甲國提供武器協助乙國以武力兼併丙國領土之協議", D: "甲、乙兩國之國營企業間簽訂於甲國採礦之合作開發協議" }, answer: "A", explain: "條約定義與主體：依《維也納條約法公約》（VCLT）第 2 條第 1 項第 (a) 款規定，條約指「國家間所締結而以國際法為準之國際書面協定」。創設國際組織之協定：依第 5 條規定，「本公約適用於為一國際組織之組織憲章之任何條約」。多國（國家主體）間簽訂創設政府間國際組織（如聯合國憲章、世界衛生組織組織法等）之協議，主體適格、以國際法為準據法且目的合法，完全符合公約規定，得為有效之國際條約。" },
  { id: 58, question: "關於國家之分類及其效果，下列敘述何者錯誤？", options: { A: "大英國協與法蘭西聯盟為非國際組織之國家結合體", B: "獨立國協屬於單一國家型態之國家", C: "被保護國得依條約賦予保護國為其行使外交權限", D: "被保護國之國民通常不取得保護國之國籍" }, answer: "B", explain: "獨立國協並非單一國家：獨立國協（Commonwealth of Independent States, CIS）是 1991 年前蘇聯解體後，由俄羅斯、白俄羅斯、烏克蘭等原加盟共和國簽署《阿拉木圖宣言》等協定所組成的鬆散區域性國家聯合體（國際組織）。" },
  { id: 59, question: "下列何者應適用完全繼承原則？", options: { A: "所欲繼承之條約，對締約國資格設有須經其他締約國同意之特定條件", B: "新獨立之國家因憲政體制要求，無法繼續履行所脫離母國之條約義務", C: "叛亂團體在控制部分領土期間與他國訂立條約，嗣後擊敗該叛亂團體並回復統治之政府，拒絶履行該條約", D: "透過合法選舉程序取得執政之新政府，拒絕清償舊政府執政期間為興建水壩向他國舉借之外債" }, answer: "D", explain: "政府繼承採「完全繼承」：新政府代表該國承繼統治權時，原則上應完全繼承前政府代表國家所對外承擔的國際權利與義務。國債繼承：舊政府為國家公益（如興建水壩、公共建設）所舉借之正當國家債務，屬於國家的債務，而非特定統治者的私人債務。新政府透過合法選舉執政，代表同一國家主體，應適用完全繼承原則，不得以政府換屆為由拒絕清償外債。因此，新政府主張拒絕清償違反國際法，此情境應適用完全繼承原則。" },
  { id: 60, question: "關於國際組織之法律人格，下列敘述何者正確？", options: { A: "國際組織之法律人格，以成立該組織之條約明示規定者為限", B: "國際組織就其受雇人員執行職務時因他國不法行為所受之損害，得對該國請求賠償", C: "具有國際法律人格之國際組織，在其會員國當然取得國內法上之法律人格", D: "國際組織內部之法律爭端，均受該組織總部所在地國之司法管轄" }, answer: "B", explain: "國際組織為維護其獨立行使職務之代理人（受雇人員），就其執行職務時因他國之不法行為所受之損害，有權代表其人員對加害國提出國際求償，請求損害賠償。（案情背景：聯合國調停特使貝納多特伯爵（Count Bernadotte）在耶路撒冷執行調停職務時遭刺殺身亡，聯合國大會向 ICJ 請求諮詢意見：聯合國是否有權向責任國提出國際賠償請求？）" },
  { id: 61, question: "關於沿海國之內水，下列敘述何者錯誤？", options: { A: "河口兩側適當點劃設之直線封口線，其長度不得超過 24 海里", B: "外國船舶於他國內水享有無害通過權", C: "經沿海國同意進入其內水之外國軍艦，於內水仍享有主權豁免", D: "群島基線內部固然屬於群島國家之內水，但在符合 1982 年聯合國海洋法公約之條件下仍允許外國船舶通行" }, answer: "B", explain: "依 1982 年《聯合國海洋法公約》（UNCLOS）第 17 條規定，外國船舶僅於「領海」享有「無害通過權（Right of Innocent Passage）」。依公約第 8 條第 1 項規定，領海基線向陸一側的水域構成國家之「內水」。沿海國對內水享有與陸地領土完全相同之排他性完整主權，外國船舶原則上於他國內水「無」無害通過權" },
  { id: 62, question: "關於領土主權之得喪變更及其效果，下列敘述何者正確？", options: { A: "一國因行使自衛權而占領侵略國之部分領土，得逕行主張取得該領土主權", B: "一國得僅依「既存占有原則（doctrine of uti possidetis）」主張固有疆域之領土主權", C: "一國得僅因地理上之毗鄰或地質上的延伸關係而取得該領土之主權", D: "因條約移轉領土主權，受讓國有義務賦予移轉領土上人民以受讓國之國籍" }, answer: "D", explain: "依國際法基本原則及聯合國國際法委員會（ILC）《關於國家繼承對自然人國籍之影響條款草案》（Draft Articles on Nationality of Natural Persons in relation to the Succession of States）第 4 條與第 5 條之規定，為貫徹《世界人權宣言》第 15 條保障之「國籍權」並防止人民因領土變更而淪為無國籍人，領土受讓國有法定義務賦予居住於該移轉領土上之人民受讓國國籍（通常伴隨給予居民一定期間行使國籍選擇權）。" },
  { id: 63, question: "關於防空識別區，下列敘述何者正確？", options: { A: "航經防空識別區之外國航空器，有義務事前對劃定國提交飛航計畫書", B: "防空識別區須以飛航情報區為其劃定範圍", C: "防空識別區由劃定國片面劃定，目的為基於防空需要迅速定位並管制他國航空器", D: "防空識別區一經劃定，其效力等同於一國之領空" }, answer: "C", explain: "防空識別區並非由任何國際公約（如《芝加哥公約》或《聯合國海洋法公約》）所明文設立之法定區域，而係沿海國基於國家安全與國防防空之迫切需要，依其國內法片面劃定（Unilateral Declaration）向外延伸至國際空域之空域範圍。其核心目的在於：給予沿海國足夠的預警時間與空間距離，以便及早發現、識別、迅速定位並對接近其領空的飛行器採取必要的查證、辨識與管制作為，以確保領空安全。" },
  { id: 64, question: "甲國國民 A 因被甲國判處死刑，遂逃亡至依公民與政治權利國際公約廢止死刑之締約國乙國，乙國決定將 A 遣返甲國。依聯合國人權事務委員會相關見解，下列敘述何者正確？", options: { A: "乙國廢除死刑之公約義務，僅涵蓋其本國人與境內受審判之刑事被告", B: "若乙國已盡全力與甲國協調後甲國仍拒絕承諾不執行 A 死刑，則乙國已克盡保護 A 生命權之義務", C: "乙國無條件遣返 A 等於間接執行其死刑，本身即構成違反公約保護 A 生命權之義務", D: "乙國雖已經簽署加入該公約第二號廢死議定書，但僅遣返 A 而未自己執行死刑，不構成對生命權之侵害" }, answer: "C", explain: "2003 年《賈吉案》正式變更早期見解：委員會確立，凡已廢除死刑的公約締約國，負有不得將任何人置於面臨被執行死刑之「實質風險（real risk）」中的消極與積極義務。" },
  { id: 65, question: "關於第三國參加國際法院訴訟程序，下列敘述何者錯誤？", options: { A: "第三國認為其具有法律性質之利益將因判決受影響，得向法院聲請參加訴訟", B: "在訴訟當事國反對之下，法院仍得允許第三國參加訴訟", C: "當多邊條約解釋發生爭議時，書記官長有義務通知訴訟當事國外之締約國", D: "法院之判決對參加訴訟之第三國不生拘束力" }, answer: "D", explain: "" },
  { id: 66, question: "甲為無國籍人，生長在 A 國，於 18 歲時赴 B 國留學，現年 21 歲，留學期間居住於 B 國某大學之宿舍。依 A 國法，甲之住所已遷至 B 國；依 B 國法，甲尚未在 B 國取得住所。依涉外民事法律適用法之規定，應適用甲之本國法時，法院應如何決定準據法？", options: { A: "甲有多數住所，應適用其關係最切之住所地法", B: "甲有多數住所，應適用其居所地法", C: "甲住所不明，應適用其關係最切之法律", D: "甲住所不明，應適用其居所地法" }, answer: "D", explain: "依《涉外民事法律適用法》第 2 條規定：「依本法應適用當事人本國法，而當事人無國籍時，適用其住所地法。」依同法第 3 條第 1 項規定：「當事人有多數住所時，適用其關係最切之住所地法。」依同法第 3 條第 2 項前段規定：「當事人住所不明者，適用其居所地法。」(註：若居所亦不明或有多數居所時，始依第 3 條第 2 項後段「適用其關係最切之居所地法；居所不明者，適用其關係最切之法律」)。" },
  { id: 67, question: "A 公司係由我國人甲、乙及日本人丙（在臺北有住所）共同出資，依英屬維京群島法律設立。甲、乙二人在香港酒店召開臨時股東會，決議將丙解除代表人職務。丙遂主張股東會決議違法，向我國法院提起確認股東會決議無效之訴。假設本案無國際管轄權爭議，我國法院應如何適用法律？", options: { A: "依我國法", B: "依英屬維京群島法", C: "依日本法", D: "依香港法" }, answer: "B", explain: "依《涉外民事法律適用法》第 13 條規定：「法人以其設立登記之法為其本國法。」依同法第 14 條規定：「法人之內部關係，依其本國法。」所謂「法人內部關係」，涵蓋法人內部機關之組織、權限、股東權利義務、股東會與董事會之召集程序、決議方法與決議瑕疵之效力（如確認股東會決議無效、得撤銷或不成立）。" },
  { id: 68, question: "向我國法院起訴之民事事件，下列何者與依涉外民事法律適用法無關？", options: { A: "日本人甲死於我國，並於我國遺有財產，其妻我國人乙，於我國法院起訴請求繼承於我國遺產", B: "大陸地區人民甲死於我國，並於我國遺有財產，其妻我國人乙，於我國法院起訴請求繼承於我國之遺產", C: "我國人甲、乙於日本，就乙位於英國之土地訂定買賣契約，其後乙不履行契約，甲於我國法院起訴乙請求履行契約", D: "香港人甲與我國人乙於日本，就乙位於英國之土地訂定買賣契約，其後乙不履行契約，甲於我國法院起訴乙請求履行契約" }, answer: "B", explain: "大陸地區人民與臺灣地區人民間之民事事件，因涉及國家統一前之特殊兩岸關係，依《中華民國憲法增修條文》第 11 條授權，另定有特別法——《臺灣地區與大陸地區人民關係條例》（簡稱《兩岸條例》）。" },
  { id: 69, question: "關於夫妻財產制之準據法，下列敘述何者正確？", options: { A: "夫妻得合意適用其一方之本國法或住所地法，且其合意應以書面為之", B: "關於不動產，夫妻得合意適用其所在地法", C: "夫妻於我國法院起訴後，得合意適用我國法律", D: "夫妻合意適用外國法時，非經登記，不得對抗第三人" }, answer: "A", explain: "依《涉外民事法律適用法》第 48 條第 1 項規定：「夫妻財產制，夫妻以書面合意適用其一方之本國法或住所地法者，依其合意所定之法律。」" },
  { id: 70, question: "下列涉外法律關係，何者非依當事人之本國法？", options: { A: "美國人甲收養我國人乙", B: "我國人甲扶養其美國籍之子乙", C: "德國人死亡，在我國遺有財產，而依法無人繼承時之處理", D: "日本人立遺囑，遺贈財產給我國人" }, answer: "C", explain: "依《涉外民事法律適用法》第 61 條規定：「外國人死亡，在中華民國遺有財產，依被繼承人本國法無人繼承者，其在中華民國境內之遺產，依中華民國法律處理。」" },
  { id: 71, question: "A 國人甲與 B 國人乙訂立一買賣契約，約定以 C 國法為該契約之準據法，一年後甲歸化為我國人。關於該契約當事人之行為能力，法院應如何適用法律？", options: { A: "當事人具備完全行為能力乃契約生效之要件，應依契約準據法 C 國法", B: "依訴訟時之本國法，甲依我國法，乙依 B 國法", C: "依行為時之本國法，甲依 A 國法，乙依 B 國法", D: "依法庭地法，故均依我國法" }, answer: "C", explain: "依《涉外民事法律適用法》第 9 條第 1 項規定：「人之權利能力及行為能力，依其本國法。」行為能力屬於保護個人及交易安全之強行性基本能力，不適用當事人意思自治原則，因此雙方縱使約定契約準據法為 C 國法，該約定亦不得及於行為能力，行為能力仍應各自依當事人的「本國法」定之。" },
  { id: 72, question: "我國人甲（住所臺北）向韓國人乙（住所首爾）購買貨物一批，買賣契約簽訂地在越南胡志明市，但未約定準據法。關於系爭買賣契約是否應經公證始為有效之問題，我國法院應如何適用法律？", options: { A: "依越南法", B: "依韓國法或我國法", C: "依我國法或越南法", D: "依韓國法或越南法" }, answer: "D", explain: "依《涉外民事法律適用法》第 16 條本文及但書規定：「法律行為之方式，依該行為所應適用之法律。但依行為地法所定之方式者，亦為有效。」本題契約簽訂地在越南胡志明市，故行為地法為「越南法」。又依同法第 20 條規定：當事人未合意約定準據法時，依關係最切之法律（第 20 條第 2 項）。依第 20 條第 3 項本文規定：「法律行為所生之債務中有特徵性給付（characteristic performance）者，推定與該特徵性給付之債務人住所地法關係最切。」在買賣契約中，買受人支付金錢並非特徵性給付；出賣人（韓國人乙，住所首爾）負有交付貨物並移轉標的物所有權之義務，出賣人方為「特徵性給付之債務人」。" },
  { id: 73, question: "A 國人甲男與 B 國人乙女結婚，婚後定居於我國，某日由於住屋漏水，乙女未經甲男同意，即以甲男名義與 C 國人丙簽訂房屋修繕契約。關於乙是否有此代理權，應適用何國法律？", options: { A: "我國法", B: "A 國法", C: "B 國法", D: "C 國法" }, answer: "A", explain: "日常家務代理權並非基於本人以法律行為授與（即非意定代理，排除適用《涉外民事法律適用法》第 19 條意定代理之規範），而係基於配偶之身分關係由法律直接賦予，在國際私法上定性為「婚姻之普通效力」。依《涉外民事法律適用法》第 46 條規定：「婚姻之效力，依夫妻共同之本國法；無共同之本國法時，依共同之住所地法；無共同之住所地法時，依與夫妻婚姻關係最切地之法。」" },
  { id: 74, question: "德國甲公司向我國乙銀行貸款新臺幣 8,000 萬元，並約定 1 年後全數償還，但 1 年後甲公司未依約還款，乙銀行遂向我國法院起訴甲公司請求還款。我國法院於本案之法律適用，下列敘述何者錯誤？", options: { A: "甲公司與乙銀行於締約後以視訊會議約定以德國法為準據法，我國法院應適用德國法", B: "甲公司與乙銀行簽訂之貸款契約書中有以德國法為準據法之約款，依德國法該約款無效，應認為無準據法之約定，而依涉外民事法律適用法第 20 條第 2、3 項擇定準據法", C: "甲公司與乙銀行未約定準據法，應推定締約時甲公司之住所地法，即德國法為關係最切之法律，而以之為準據法", D: "甲公司與乙銀行於締約時未約定準據法，於第二審訴訟進行中，約定以德國法為準據法，法院即應以德國法為應適用之法律" }, answer: "C", explain: "依《涉外民事法律適用法》第 20 條第 2 項及第 3 項規定，當事人未約定準據法時，依關係最切之法律；法律行為所生之債務中有特徵性給付者，推定與該特徵性給付之債務人住所地法關係最切。金錢消費借貸契約之特徵，係貸與人（出借金錢之乙銀行）向借款人提供資金並移轉所有權之行為。因此，消費借貸契約之「特徵性給付債務人」為貸與人（乙銀行）。乙銀行為我國法人（主營業所或住所在我國），依法應推定「我國法」為關係最切之法律，而非德國法。" },
  { id: 75, question: "關於國際裁判管轄，下列敘述何者正確？", options: { A: "我國民事訴訟法所定管轄原因存在於我國時，我國法院即應行使管轄權", B: "原告請求確認被告本於侵權行為對於原告請求排除侵害之權利不存在時，侵權行為地在我國境內者，我國法院得行使管轄權", C: "夫妻雙方均為外國人時，我國法院對於確認婚姻關係不存在之訴無管轄權", D: "就坐落外國之不動產之物權而涉訟者，應否定我國法院之管轄權" }, answer: "B", explain: "最高法院 107 年度台上字第 267 號判決：我國涉外民事訴訟之「國際裁判管轄權」，法律並無全面明文規範，實務上係類推適用民事訴訟法關於土地管轄之規定，並兼顧當事人實質公平、程序利益與妥速審判等法理。依民事訴訟法第 15 條第 1 項規定：「因侵權行為涉訟者，得由行為地之法院管轄。」最高法院明確認定：涉外民事訴訟中，不論是積極請求侵權行為損害賠償／排除侵害，抑或是由原告提起消極確認之訴（請求確認被告本於侵權行為對原告之排除侵害請求權不存在），其訴訟本質均繫於「侵權行為法律關係之存否」，均得類推適用民事訴訟法第 15 條第 1 項規定。" },
  { id: 76, question: "甲係 15 歲之未成年人，對於乙有新臺幣 10 萬元之債權，其請求權之消滅時效，本來應在民國（下同）112 年 6 月 30 日完成。惟甲之父母（法定代理人）不幸於 112 年 5 月 10 日之旅遊事故中同時死亡，而甲又無其他人可為其監護人，致甲成為無法定代理人之人，嗣法院選定丙為甲之監護人，丙於112 年 7 月 5 日就職。該請求權若未行使，關於消滅時效完成，下列敘述，何者正確？", options: { A: "於 112 年 6 月 30 日消滅時效完成", B: "於 112 年 12 月 30 日消滅時效完成", C: "於 113 年 1 月 5 日消滅時效完成", D: "於 113 年 7 月 5 日消滅時效完成" }, answer: "C", explain: "依《民法》第 141 條規定，無行為能力人或限制行為能力人，對於其法定代理人之權利，於其成為有行為能力人或另行選定法定代理人就職以前，其時效不完成；於其欠缺法定代理人，而受請求權消滅時效利益之人為法定代理人時，亦同。此外，限制行為能力人無親權人或監護人者，自其得行使權利之法定代理人就職時起，6 個月內，其時效不完成。甲之時效原應於 112 年 6 月 30 日完成，但甲於 112 年 5 月 10 日起欠缺法定代理人，時效暫不完成；新監護人丙於 112 年 7 月 5 日就職，依法自丙就職時起 6 個月內（即至 113 年 1 月 5 日）時效不完成，故消滅時效於 113 年 1 月 5 日始完成。" },
  { id: 77, question: "甲為 A 屋之所有人，先與乙訂立買賣契約，後與丙訂立買賣契約，並以移轉所有權之意思，將 A 屋登記在丙之名下。下列敘述，何者正確？", options: { A: "甲與乙訂立買賣契約在先，乙取得 A 屋之所有權", B: "乙與丙各有優勢地位，故分別共有 A 屋之所有權", C: "甲將 A 屋登記在丙之名下，丙取得 A 屋之所有權", D: "乙與丙互不相讓，以抽籤決定誰取得 A 屋所有權" }, answer: "C", explain: "不動產物權之移轉，採登記生效要件主義（《民法》第 758 條第 1 項）。債權契約具有平等性與相對性，一物二賣時，兩買賣契約均屬有效，但所有權之歸屬以完成物權移轉登記者取得。甲已以移轉所有權意思將 A 屋登記給丙，丙即取得 A 屋所有權。乙僅得依買賣契約向甲主張債務不履行損害賠償責任。" },
  { id: 78, question: "甲資產頗豐，持有 A 股份有限公司 80%之股份。甲 80 歲時罹患失智症，受輔助宣告，其兒子乙擔任輔助人。A 公司召開股東會改選董監事時，甲自己行使投票權。甲投票行為之效力如何？", options: { A: "行使股東表決權，無庸經輔助人之同意，甲之行為有效", B: "行使股東表決權，應經輔助人之同意，甲未得乙之同意，其行為效力未定", C: "行使股東表決權，屬於純獲法律上利益，故甲之行為有效", D: "行使股東表決權，應經輔助人之同意，甲未得乙之同意，其行為無效" }, answer: "A", explain: "受輔助宣告之人，僅於為《民法》第 15 條之 2 第 1 項所列之重大法律行為（如為獨資合夥、消費借貸、贈與、訴訟行為等）時，始應經輔助人同意。股東表決權之行使係共益權之行使，非屬該條項各款所列應經輔助人同意之行為，甲自己行使表決權即屬有效。" },
  { id: 79, question: "下列何項意思表示得撤銷？", options: { A: "甲誤以為手機遺失而購買新手機", B: "甲誤以為捷運將經過 A 區而於 A 區購買房屋", C: "甲誤以為乙有律師執照而委任其處理訴訟事務", D: "甲承攬乙公司之清潔工作，內心以每小時新臺幣（下同）500 元計算，但因計算錯誤而報價：「約需8 小時，總計 3000 元」" }, answer: "C", explain: "(A)、(B) 均屬「動機錯誤」，原則上不得撤銷。(C) 依《民法》第 88 條第 2 項，當事人之資格在交易上認為重要者，其錯誤視為意思表示內容之錯誤，表意人得依規定撤銷之；委任訴訟事務以受任人具備律師執照為重要資格，甲得撤銷委任之意思表示。(D) 承攬人內部單純計算錯誤但直接對外為總額報價者，屬於動機錯誤，不得撤銷。" },
  { id: 80, question: "以公益為目的之法人解散後，其賸餘財產之歸屬，依民法規定，下列敘述，何者錯誤？", options: { A: "依法律規定決定", B: "由主管機關決定", C: "依總會決議決定", D: "依章程決定" }, answer: "B", explain: "依《民法》第 44 條第 1 項，法人解散後，其賸餘財產之歸屬，依其章程之規定，或總會之決議；但以公益為目的之法人解散時，其賸餘財產不得歸屬於自然人或以營利為目的之團體。如無前項章程之規定或總會之決議，其賸餘財產歸屬於法人住所所在地之「地方自治團體」（依法律規定決定，第 44 條第 2 項）。法條並無賦予「主管機關」自行決定賸餘財產歸屬之權限，故 (B) 錯誤。" },
  { id: 81, question: "下列關於代理之敘述，何者錯誤？", options: { A: "代理人代理本人出賣房屋，非經本人同意，代理人不得購買該屋", B: "代理人向相對人購買房屋時，明知有瑕疵，本人不得向相對人主張瑕疵擔保責任", C: "本人若為善意無過失，縱代理人為惡意，本人仍得因善意取得動產之所有權", D: "代理人受相對人詐欺，本人得撤銷該意思表示" }, answer: "C", explain: "依《民法》第 105 條本文規定，代理人之意思表示，因其意思欠缺、被詐欺、被脅迫，或明知其事情或可得而知其事情，致其效力受影響時，其事實之有無，審究代理人何如。若代理人為惡意，縱本人善意，原則上仍不得主張善意取得（第 105 條但書僅於依本人指示為特定法律行為時始適用），故 (C) 敘述錯誤。" },
  { id: 82, question: "下列物品同屬於甲所有，何者不具有從物與主物之關係？", options: { A: "遙控器與電視", B: "車庫之於別墅", C: "滑鼠之於電腦", D: "引擎之於內燃機汽車" }, answer: "D", explain: "從物須為「非主物之成分，常助主物之效用，而同屬於一人者」（《民法》第 68 條）。汽車之引擎已組裝附合於汽車，成為汽車之重要成分，喪失獨立物之地位，非屬「從物」，故 (D) 不具有從物與主物之關係。" },
  { id: 83, question: "下列何項法律行為得撤銷？", options: { A: "甲受乙之詐欺而購買乙之贗品", B: "甲以自己名義擅自將乙之高級皮包交付，並移轉所有權於丙", C: "甲與乙口頭約定人事保證契約，但未以書面為之", D: "甲為乙之代理人，未經乙允許而與甲自己訂立土地買賣契約" }, answer: "A", explain: "(A) 因受詐欺而為意思表示者，表意人得依《民法》第 92 條第 1 項撤銷之，符合題意。(B) 為無權處分，效力未定（《民法》第 118 條）。(C) 人事保證未以書面為之者，違反法定要式而「無效」（《民法》第 756 條之 1 第 2 項、第 73 條）。(D) 自己代理未經本人允許，屬無權代理，效力未定（《民法》第 106 條、第 170 條）。" },
  { id: 84, question: "下列關於人格法益之敘述，何者錯誤？", options: { A: "繼承人對被繼承人遺體之處分，為其人格法益保護之一部分", B: "因人格權受侵害之侵害除去請求權，自請求權人知侵權行為時起，10 年間不行使而消滅", C: "姓名為人格法益之一部分", D: "維護未成年子女最佳利益，為保障未成年子女之人格法益" }, answer: "B", explain: "人格權受侵害時，人格權人得請求由法院除去其侵害（《民法》第 18 條第 1 項本文）。此種「人格權之侵害除去請求權」本質上為絕對權之物權化防衛請求權，在侵害持續存在期間，不適用消滅時效之規定；只有侵權行為之損害賠償請求權始適用 2 年或 10 年時效（第 197 條），故 (B) 錯誤。" },
  { id: 85, question: "下列法律行為，何者為不須向相對人表示，即可發生效力之單獨行為？", options: { A: "債務之免除", B: "因給付不能之解除契約", C: "捐助行為", D: "撤銷被詐欺而為之意思表示" }, answer: "C", explain: "財團法人之捐助行為係「無相對人之單獨行為」，捐助章程訂立完成或遺囑成立時即生效，不須向相對人為意思表示，故 (C) 正確。(A) 債務免除、(B) 解除契約、(D) 撤銷意思表示，均屬「有相對人之單獨行為」，須向相對人表示始生效力。" },
  { id: 86, question: "甲欲贈與乙一部單眼相機，甲與乙間因此訂立贈與契約，且於贈與契約中同時約定，乙應參加近期學校所舉辦之攝影比賽。有關本案之法律效果，下列敘述，何者正確？", options: { A: "在乙未參加比賽前，甲得主張同時履行抗辯權，拒絕贈與之履行", B: "縱使該相機有瑕疵，甲均不負瑕疵擔保責任", C: "若該相機之所有權業已移轉於乙，甲得請求乙應參加攝影比賽", D: "若該相機之所有權業已移轉於乙，甲即不得撤銷贈與契約" }, answer: "C", explain: "附負擔之贈與，贈與人已為給付而受贈人不履行其負擔時，贈與人得請求受贈人履行其負擔，或撤銷贈與（《民法》第 412 條第 1 項），故 (C) 正確。(A) 附負擔贈與仍為單務無償契約，不得主張同時履行抗辯；(B) 於負擔之限度內，負與出賣人同一之擔保責任（第 414 條本文但書）；(D) 物權移轉後若不履行負擔，仍得撤銷贈與。" },
  { id: 87, question: "關於土地與其上之房屋，其法律關係之擬制或推定。下列敘述，何者錯誤？", options: { A: "租用基地建築房屋，推定承租人與出租人間有地上權關係", B: "土地及其地上之房屋同屬一人所有，僅將土地讓與他人者，於土地受讓人與房屋所有人間，推定有租賃關係", C: "土地及其地上之建築物同屬一人所有，設定普通抵押權時僅以土地設定抵押者，於抵押物拍賣時，視為已有地上權之設定", D: "土地及其地上之建築物同屬一人所有，因強制執行拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定" }, answer: "A", explain: "租用基地建築房屋，承租人與出租人間為「債權租賃關係」，民法並無將其「推定為地上權」之規定，故 (A) 錯誤。(B) 符合《民法》第 425 條之 1（推定有租賃關係）；(C) 符合第 876 條（法定地上權，視為已有地上權之設定）；(D) 符合第 838 條之 1（拍定人各異視為已有地上權設定）。" },
  { id: 88, question: "甲與 17 歲之乙訂立使用借貸契約，將其所有之別墅借給乙使用。下列關於使用借貸契約效力之敘述，何者正確？", options: { A: "使用借貸契約對乙是純獲法律上利益，故有效", B: "使用借貸契約對乙非純獲法律上利益，故無效", C: "使用借貸契約因乙限制行為能力，故效力未定", D: "使用借貸契約對乙因是無償契約，故得撤銷" }, answer: "C", explain: "使用借貸為契約行為，借用人負有保管物、依約使用及返還借用物之義務，並非「純獲法律上利益」。17 歲之乙為限制行為能力人，未得法定代理人允許所訂立之使用借貸契約，依《民法》第 79 條規定，效力未定。" },
  { id: 89, question: "下列關於消滅時效之規定，何者錯誤？", options: { A: "時效因起訴而中斷者，若撤回其訴，視為不中斷", B: "請求權時效完成而消滅，債務人仍為履行之給付者，得依不當得利請求返還", C: "時效中斷者，自中斷之事由終止時，重新起算", D: "主權利因時效消滅者，其效力及於從權利" }, answer: "B", explain: "依《民法》第 144 條第 2 項規定：「請求權已經時效消滅，債務人仍為履行之給付者，不得以不知時效為理由，請求返還；其以契約承認該債務者，亦同。」履行時效完成之債務為自然債務之履行，具有法律上原因，不構成不當得利，故 (B) 錯誤。" },
  { id: 90, question: "甲從其父親繼承 A 屋，甲欲將該屋重新整修並裝潢為咖啡屋，於是向銀行借款新臺幣（下同）550 萬元，並提供 A 屋設定普通抵押權。借款後，甲與乙土木公司訂立 A 屋修繕裝潢契約，並約定修繕裝潢報酬為 400 萬元，並依法登記報酬額 400 萬元之法定抵押權。修繕裝潢期間，因原物料上漲，最終報酬額為 580 萬元，A 屋經乙整修後，A 屋市價約提高 350 萬元。惟因疫情經濟衝擊，甲陷入財務困境，甲因此又跟丙借款 400 萬元，並提供 A 屋設定普通抵押權。然甲因難以解除財務困境，無法給付修繕報酬 580 萬元、尚欠銀行300 萬元債款及丙 400 萬元債款。甲決定售出 A 屋還債，A 屋賣得 1200萬元。甲欲以賣 A 屋所得之 1200 萬元清償其債務，其清償順位為何？", options: { A: "抵押權具有排他性，因此設有抵押權之債權，其清償順位依設定先後定之，銀行之抵押權債權最早設定，屬第一順位清償之債權", B: "承攬報酬請求權為法定抵押權，A 屋修繕裝潢報酬 580 萬元，所以乙公司修繕裝潢最終報酬額 580萬元，優先於銀行之抵押權債權 300 萬元受償", C: "承攬報酬請求權，具有最優先受償權限，於依法登記之 400 萬元修繕報酬範圍內，乙就修繕裝潢報酬 400 萬元，優先於銀行之抵押權債權 300 萬元受償", D: "承攬報酬請求權，於提高價值之 350 萬元範圍內，具有優先受償之權限，所以該 350 萬元優先於銀行之抵押權債權 300 萬元受償" }, answer: "D", explain: "依《民法》第 513 條第 4 項規定，法定抵押權所擔保之承攬報酬請求權，就修繕所增加之價值限度內，有優先於抵押權（包含先設定之登記抵押權）受償之權利。本題 A 屋經整修後市價提高 350 萬元，故乙在此提高之 350 萬元價值範圍內，優先於第一順位銀行之抵押權受償，故 (D) 正確。" },
  { id: 91, question: "依民法規定，下列何者屬於諾成契約？", options: { A: "代物清償契約", B: "使用借貸契約", C: "定金契約", D: "保證契約" }, answer: "D", explain: "(A) 代物清償契約、(B) 使用借貸契約（第 464 條）、(C) 定金契約（第 248 條），均須有物之交付，屬要物契約。(D) 保證契約僅須當事人雙方意思表示一致即成立，為諾成契約，故選 (D)。" },
  { id: 92, question: "若契約未另有訂定，下列何種情形，買受人得依物之瑕疵擔保規定，請求不履行之損害賠償？", options: { A: "買賣標的物為建築物，而其瑕疵重大", B: "因出賣人之重大過失，致買賣標的物毀損滅失", C: "出賣人故意不告知物之瑕疵", D: "出賣人交付其物之必要行為完結" }, answer: "C", explain: "依《民法》第 360 條規定：「買賣之標的物，缺少出賣人所保證之品質者，買受人得不請求減少價金或解除契約，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。」故選 (C)。" },
  { id: 93, question: "甲、乙訂立 A 機器之買賣契約。甲依約交付 A 於乙、乙亦給付部分價金。嗣後，因產業整體經濟狀況發生變化，乙恐無法繼續給付剩餘價金，乃取得甲之同意，合意解除 A 之買賣契約。就解約後甲應返還乙之金錢部分，下列敘述，何者正確？", options: { A: "甲乙得約定返還之範圍，未約定時，甲應返還自乙所受領之金錢，及自受領後所生利息", B: "甲乙得約定返還之範圍，未約定時，甲應返還自乙所受領之金錢，但不須返還自其受領後所生利息", C: "甲乙不得約定返還之範圍，甲應返還自乙所受領之金錢，及自其受領後所生利息", D: "甲乙不得約定返還之範圍，甲應返還自乙所受領之金錢，但不須返還自其受領後所生利息" }, answer: "B", explain: "契約之「合意解除」為契約行為，解約後之返還範圍及是否附加利息，由當事人自由協議約定；若契約未特為約定，依最高法院判例見解，不直接適用《民法》第 259 條法定解除之回復原狀規定，出賣人僅須返還所受領之金錢本金，不須加計利息，故 (B) 正確。" },
  { id: 94, question: "甲對乙有債權新臺幣（下同）200 萬元，清償日為 2025 年 12 月 5 日。但甲因急需現金，於 2025 年 3月 2 日將其對乙之債權，以 180 萬元賣於丙。下列敘述，何者錯誤？", options: { A: "甲丙間成立債權買賣契約", B: "甲丙間訂立債權買賣契約時，甲對乙之債權確係存在，原則上甲就乙之支付能力，對丙仍負擔保責任", C: "甲、丙就債權讓與未通知乙者，乙於 2025 年 12 月 5 日到銀行將 200 萬元債款匯入甲之帳戶後，乙得對丙主張債務業已清償", D: "甲丙間之債權讓與，不因未將債權讓與通知乙而影響甲丙間之效力" }, answer: "B", explain: "依《民法》第 352 條規定：「債權之出賣人，原則上不負債務人支付能力之擔保責任，但契約另有約定或法律另有規定者不在此限。」故出賣人甲原則上不負支付能力擔保責任，(B) 敘述錯誤。" },
  { id: 95, question: "甲乙因車禍造成互有車損，為免去日後繁雜處理過程，雙方訂立和解契約，以解決紛爭。下列敘述，何者正確？", options: { A: "因擔心和解雙方日後有爭議，依民法和解契約規定應作成和解書，故為要式契約", B: "若甲被乙所詐欺或脅迫，而訂立和解契約者，甲得撤銷自己之意思表示", C: "若甲乙和解內容針對彼此之車損約定賠償金額，並約定日後對車損不得再改變金額或更為請求。甲在和解 3 日後，發現因為車禍有造成腦震盪，就不得再向乙請求", D: "和解是當事人約定互相讓步以終止爭執解決事端之契約，雙方並互無給付，所以為無償契約" }, answer: "B", explain: "和解不得以錯誤為由撤銷，但依《民法》第 738 條第 3 款，有受詐欺或脅迫之情形者，仍得撤銷意思表示，故 (B) 正確。(A) 和解為不要式契約；(C) 和解範圍以外新發現之重大傷害（腦震盪）不受和解效力拘束；(D) 和解互為讓步，為有償契約。" },
  { id: 96, question: "甲將 A 屋出租於乙，租期 6 年，租金每月新臺幣 2 萬元，該租賃契約經公證後，甲將 A 屋出賣並移轉所有權登記於丙。下列敘述，何者正確？", options: { A: "若甲尚未將 A 屋交付於乙，則丙仍然承受出租人之地位，與乙發生租賃之法律關係", B: "若甲並非真正之所有人，僅為登記名義人，但已交付 A 屋於乙，並受讓人丙因善意信賴不動產登記而受登記公信力之保護時，丙仍然承受出租人之地位，與乙發生租賃之法律關係", C: "甲如將 A 屋出賣但尚未移轉登記於丙時，丙即承受出租人之地位，與乙發生租賃之法律關係", D: "原出租人甲所負擔之修繕義務，於租賃物所有權移轉登記於受讓人丙時，受讓人丙不負修繕義務" }, answer: "B", explain: "依司法院釋字第 349 號及實務通說，租賃契約經公證或具備所有權移轉不破租賃要件時，受讓人丙因善意信賴登記取得所有權，為貫徹居住權保障，丙仍承受出租人地位，故 (B) 正確。(A) 須出租人已交付房屋於承租人占有始有適用；(C) 未辦竣移轉登記前受讓人不承受出租人地位；(D) 受讓人當然承受修繕義務。" },
  { id: 97, question: "下列關於買賣標的物之瑕疵擔保責任與承攬工作物之瑕疵擔保責任之敘述，何者錯誤？", options: { A: "買受人得對出賣人主張損害賠償請求權，定作人得對承攬人主張瑕疵修補請求權", B: "買賣之標的物有瑕疵時，買受人得行使契約解除權或減少價金請求權", C: "標的物為建物之情形，於因該物之瑕疵重大致不能達使用之目的者，買受人或定作人均得解除契約", D: "買受人因重大過失而不知標的物之瑕疵，且出賣人無故意不告知其瑕疵者，出賣人不負瑕疵擔保責任；定作人僅因重大過失而不知標的物之瑕疵者，承攬人始應負瑕疵擔保責任" }, answer: "D", explain: "在承攬工作物瑕疵擔保責任中，承攬人負無過失之擔保責任，法條並無「定作人因重大過失不知瑕疵承攬人始負責」之限制；相反地，若定作人受領工作物未即時檢查並通知瑕疵者，承攬人免除責任（第 498 條），故 (D) 敘述矛盾且錯誤。" },
  { id: 98, question: "甲將 A 屋出租於乙，甲與乙約定不得轉租。下列敘述，何者正確？", options: { A: "乙若將 A 屋中其中一間小房間轉租於丙，則乙與丙之租賃契約有效", B: "乙若將 A 屋全部轉租於丙，則乙與丙之租賃契約無效", C: "乙若將 A 屋轉租於丙，甲對丙有租金請求權", D: "乙縱將 A 屋轉租於丙，甲仍不得終止契約，僅得請求損害賠償" }, answer: "A", explain: "租賃契約具有相對性，轉租契約縱然違反轉租約定，承租人與次承租人間之租賃契約在債權法上仍屬有效（承租人僅對原出租人負違約責任），故 (A) 正確、(B) 錯誤。(C) 出租人與次承租人無契約關係，無直接租金請求權；(D) 違法轉租出租人得終止租約（第 443 條第 2 項）。" },
  { id: 99, question: "甲委請乙按甲所提供之設計圖製作一張書桌，約定報酬額為新臺幣 1 萬元。惟因設計圖之瑕疵，以致該書桌終究無法完成，乙亦已事先告知甲該設計圖之瑕疵。依民法規定，有關甲與乙間法律效果之敘述，何者正確？", options: { A: "甲得隨時終止委任契約", B: "縱設計圖有瑕疵，甲仍得免除其報酬之給付義務", C: "書桌雖未完成，乙仍得請求其已服勞務之報酬", D: "縱甲無過失，乙仍得請求損害賠償" }, answer: "C", explain: "依《民法》第 509 條規定，於定作人所供給材料之性質或依其指示定作，致工作不能完成，承攬人已及時通知定作人者，承攬人得請求其已服勞務之報酬及墊款之償還，故 (C) 正確。本契約為承攬非委任（A 錯）；甲不得免除給付報酬（B 錯）；請求損害賠償須以定作人有過失為限（D 錯）。" },
  { id: 100, question: "甲將乙所寄放市價新臺幣（下同）4000 元之 A 花瓶，擅自以自己之名義出賣於丙，價金 4000 元。甲同時將 A 花瓶之所有權移轉於善意無過失之丙，甲亦自丙處獲得 4000 元之價金。下列敘述，何者正確？", options: { A: "甲與丙間之買賣契約無效", B: "丙未能取得 A 花瓶之所有權", C: "乙得依侵權行為之規定，向丙請求返還 A 花瓶", D: "乙得依非給付不當得利之規定，向甲請求返還 4000 元之價金" }, answer: "D", explain: "丙為善意受讓，已取得花瓶所有權（第 801、948 條，B 錯）；買賣負擔行為有效（A 錯）；乙喪失所有權，不得向丙請求返還（C 錯）。甲無權處分乙之花瓶獲取 4,000 元價金，係侵害乙之權益歸屬，乙得依權益歸屬說之非給付不當得利規定向甲請求返還 4,000 元利益，故 (D) 正確。" },
  { id: 101, question: "甲乙自幼為好友，乙為醫美醫師，乙有意開設醫美診所，但苦於資金不足，甲表示願意投資乙之 B 醫美診所。於是甲以價值新臺幣（下同）2000 萬元之 A 屋，提供 B 診所使用，並移轉所有權登記於乙，以及出資 200 萬元供診所裝潢用，乙則出資購買醫美儀器設備，並以乙之名義對外負責經營 B 診所，且甲乙得分受及分擔 B 診所之損益。惟乙經營不善，不僅積欠儀器設備商丙 3000 萬元債務，又有嚴重醫美糾紛，負擔高額債務。下列敘述，何者錯誤？", options: { A: "甲乙間為隱名合夥之法律關係，甲為隱名合夥人，乙為出名營業人", B: "乙積欠丙之債務，雖然屬於 B 診所所需之設備，但甲對乙因執行合夥業務所積欠之債務，不負連帶給付義務", C: "B 診所及診所內之設備，屬於甲乙公同共有", D: "B 診所因財務困境無法再經營下去，乙得賣 A 屋償還 B 診所對外之債務" }, answer: "C", explain: "依《民法》第 702 條規定：「隱名合夥人之出資，其所有權移轉於出名營業人。」因此診所及其設備與房屋所有權均歸出名營業人乙單獨所有，絕非甲乙公同共有，故 (C) 錯誤。" },
  { id: 102, question: "甲之建築物 1 棟借與乙使用，乙未經甲之同意，竟將之出租於丙使用。下列敘述，何者正確？", options: { A: "乙、丙間之租賃契約，因未經甲之同意，應屬無效", B: "民法第 952 條有關善意占有人就占有物得為使用收益之規定，僅於動產，始得適用", C: "依民法第 952 條規定不得排除不當得利之適用，故甲得依不當得利規定，請求丙返還其所受之利益", D: "若丙為善意，依民法第 952 條規定，使用租賃物所獲得之利益，對甲不負返還義務" }, answer: "D", explain: "依《民法》第 952 條規定，善意占有人依推定其為合法所有之權利，得為占有物之使用及收益。實務見解認為，善意占有人本於其使用收益權限使用占有物所獲之利益，排除不當得利之適用，對所有人不負返還利益義務，故 (D) 正確、(C) 錯誤。(A) 租賃為債權契約，無權出租仍屬有效；(B) 不動產亦適用善意占有之規定。" },
  { id: 103, question: "下列關於普通地上權之敘述，何者錯誤？", options: { A: "地上權存續期限屆滿前，縱建築物滅失，地上權仍不因而消滅", B: "租地建屋契約之承租人，不得請求出租人就租用土地設定地上權", C: "地上權非以地上權人交付地租為必要", D: "定有存續期間之地上權，於期限屆滿時，地上權原則上消滅" }, answer: "B", explain: "依《土地法》第 102 條規定：「租用基地建築房屋，應由出租人與承租人於契約成立後二個月內，聲請該管直轄市或縣（市）地政機關為地上權之設定登記。」承租人依法得請求出租人協同設定地上權，故 (B) 錯誤。" },
  { id: 104, question: "甲向乙借錢週轉若干金額，並由甲之好友丙提供名下土地，設定普通抵押權於乙，俾擔保乙對甲之上開債權。嗣後，甲對乙清償全部借款，但未塗銷前揭抵押權登記。乙將上開已消滅之債權及抵押權讓與善意丁，業經登記完竣。下列敘述，何者錯誤？", options: { A: "丁受登記公信力之保護，得善意取得丙土地上之普通抵押權", B: "甲對乙清償全部借款，普通抵押權即歸消滅", C: "丙就甲對乙清償借款一事，係為有利害關係之第三人", D: "丙設定普通抵押權於乙之行為，非經登記，不生效力" }, answer: "A", explain: "抵押權具有從屬性，主債權因清償而消滅時，普通抵押權依法當然消滅（《民法》第 307 條）。實務見解（最高法院裁判）認為，債權既已消滅，債權讓與不生效力，縱登記者亦無從善意取得附隨之抵押權（普通抵押權不得獨立於債權之外善意取得），故 (A) 敘述錯誤。" },
  { id: 105, question: "除法律另有規定或契約另有約定外，下列何者不得主張定限物權效力所及孳息之權利人？", options: { A: "抵押物扣押前之抵押權人", B: "動產之留置權人", C: "不動產之典權人", D: "證券質權之質權人" }, answer: "A", explain: "依《民法》第 863 條規定：「抵押權之效力，及於抵押物扣押後自抵押物分離之天然孳息，及抵押人就抵押物得收取之法定孳息。」扣押前抵押人仍有使用收益權，抵押物扣押前之抵押權人不得主張效力及於孳息，故 (A) 不得主張。(B) 留置權（第 932 條）、(C) 典權（第 911 條）、(D) 證券質權（第 906 條）均得收取孳息。" }
];
let currentQuizList = [];
let userAnswers = {};
let currentIndex = 0;
const QUIZ_SIZE = Math.min(10, masterQuizData.length);
const POINT_PER_Q = 10;
function getRandomSample(arr, size) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, size);
}
function startNewQuiz() {
  currentQuizList = getRandomSample(masterQuizData, QUIZ_SIZE);
  userAnswers = {};
  currentIndex = 0;
  document.getElementById('quiz-panel').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
  buildJumpBar();
  loadQuestion(0);
}
function buildJumpBar() {
  const container = document.getElementById('jump-bar');
  container.innerHTML = '';
  for (let i = 0; i < currentQuizList.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'jump-btn';
    btn.id = `jump-btn-${i}`;
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    container.appendChild(btn);
  }
}
function updateJumpBar() {
  for (let i = 0; i < currentQuizList.length; i++) {
    const btn = document.getElementById(`jump-btn-${i}`);
    if (!btn) continue;
    btn.className = 'jump-btn';
    if (i === currentIndex) btn.classList.add('current');
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i] === currentQuizList[i].answer) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-wrong');
      }
    }
  }
}
function loadQuestion(index) {
  currentIndex = index;
  const current = currentQuizList[currentIndex];
  document.getElementById('progress-text').innerText = `進度：${currentIndex + 1} / ${QUIZ_SIZE} 題`;
  document.getElementById('tag').innerText = `第 ${currentIndex + 1} 題 (題庫原題號: ${current.id} | 本題 10 分)`;
  document.getElementById('q-text').innerText = current.question;
  const optContainer = document.getElementById('options');
  optContainer.innerHTML = '';
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'none';
  feedback.className = 'feedback';
  for (const [key, value] of Object.entries(current.options)) {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.id = `opt-btn-${key}`;
    btn.innerText = `(${key}) ${value}`;
    btn.onclick = () => selectAnswer(key);
    optContainer.appendChild(btn);
  }
  if (userAnswers[currentIndex] !== undefined) restoreAnsweredState();
  document.getElementById('btn-prev').disabled = (currentIndex === 0);
  if (currentIndex === QUIZ_SIZE - 1) {
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-finish').style.display = 'inline-block';
  } else {
    document.getElementById('btn-next').style.display = 'inline-block';
    document.getElementById('btn-finish').style.display = 'none';
  }
  updateJumpBar();
}
function selectAnswer(selectedKey) {
  userAnswers[currentIndex] = selectedKey;
  restoreAnsweredState();
  updateJumpBar();
}
function restoreAnsweredState() {
  const current = currentQuizList[currentIndex];
  const selectedKey = userAnswers[currentIndex];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(btn => btn.disabled = true);
  const selectedBtn = document.getElementById(`opt-btn-${selectedKey}`);
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  const explainHtml = current.explain ? `<br>${current.explain}` : '';
  if (selectedKey === current.answer) {
    if (selectedBtn) selectedBtn.classList.add('correct');
    feedback.className = 'feedback correct-box';
    feedback.innerHTML = `<strong>? 答對了！(+10分)</strong>${explainHtml}`;
  } else {
    if (selectedBtn) selectedBtn.classList.add('wrong');
    feedback.className = 'feedback wrong-box';
    feedback.innerHTML = `<strong>? 答錯了！</strong> 您的答案是 (${selectedKey})，標準答案為 (${current.answer})。${explainHtml}`;
    const correctBtn = document.getElementById(`opt-btn-${current.answer}`);
    if (correctBtn) correctBtn.classList.add('correct');
  }
}
function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() { if (currentIndex < QUIZ_SIZE - 1) loadQuestion(currentIndex + 1); }
function jumpToQuestion(index) { loadQuestion(index); }
function showResults() {
  let correctCount = 0;
  const wrongList = [];
  for (let i = 0; i < currentQuizList.length; i++) {
    const q = currentQuizList[i];
    const userAns = userAnswers[i];
    if (userAns === q.answer) {
      correctCount++;
    } else {
      wrongList.push({
        quizIndex: i + 1,
        question: q.question,
        userAns: userAns ? `(${userAns}) ${q.options[userAns]}` : '未作答',
        correctAns: `(${q.answer}) ${q.options[q.answer]}`,
        explain: q.explain
      });
    }
  }
  const finalScore = correctCount * POINT_PER_Q;
  document.getElementById('total-score').innerText = `${finalScore} 分`;
  document.getElementById('score-summary').innerText = `共 ${QUIZ_SIZE} 題，答對 ${correctCount} 題，答錯 ${QUIZ_SIZE - correctCount} 題 (答對率 ${(correctCount / QUIZ_SIZE * 100).toFixed(0)}%)`;
  const wrongContainer = document.getElementById('wrong-container');
  if (wrongList.length === 0) {
    wrongContainer.innerHTML = '<div style="text-align:center; padding: 24px; color: #166534; background: #f0fdf4; border-radius: 12px; font-weight: bold; font-size: 16px;">恭喜全部答對！本次測驗榮獲滿分 100 分！</div>';
  } else {
    wrongContainer.innerHTML = '<div class="wrong-section-title">錯題檢討清單（共 ' + wrongList.length + ' 題）</div><div id="wrong-list"></div>';
    const targetDiv = document.getElementById('wrong-list');
    wrongList.forEach(item => {
      const card = document.createElement('div');
      card.className = 'wrong-card';
      card.innerHTML = '<div class="wrong-q-title">第 ' + item.quizIndex + ' 題：' + item.question + '</div>' +
        '<div class="wrong-answer-row"><strong>您的作答：</strong><span style="color: #b91c1c;">' + item.userAns + '</span></div>' +
        '<div class="wrong-answer-row"><strong>標準答案：</strong><span style="color: #15803d; font-weight: bold;">' + item.correctAns + '</span></div>' +
        '<div class="wrong-explain"><strong>【解析說明】</strong><br>' + (item.explain || '暫無解析') + '</div>';
      targetDiv.appendChild(card);
    });
  }
  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
startNewQuiz();
</script>
